name: Event Submission
description: Submit a Preterist event
title: "[Event]: "
labels: ["event-submission"]

body:
  - type: markdown
    attributes:
      value: |
        ## Preterist Event Submission
        Fill out all required fields. Dates should be ISO 8601 format.
        Example: `2026-06-15T09:00:00Z`

  - type: input
    id: id
    attributes:
      label: Event ID
      description: Unique slug-style identifier (lowercase, hyphens)
      placeholder: nashville-conference-2026
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Nashville Preterist Conference 2026
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the event
    validations:
      required: true

  - type: input
    id: startDate
    attributes:
      label: Start Date (ISO 8601)
      placeholder: 2026-06-15T09:00:00Z
    validations:
      required: true

  - type: input
    id: endDate
    attributes:
      label: End Date (ISO 8601)
      placeholder: 2026-06-15T17:00:00Z
    validations:
      required: true

  - type: dropdown
    id: locationType
    attributes:
      label: Location Type
      options:
        - in_person
        - online
        - hybrid
        - historical
    validations:
      required: true

  - type: input
    id: locationText
    attributes:
      label: Location Description
      placeholder: Nashville, TN or Online (Zoom)
    validations:
      required: true

  - type: input
    id: latitude
    attributes:
      label: Latitude (required for in-person or hybrid)
      placeholder: 36.1627
    validations:
      required: false

  - type: input
    id: longitude
    attributes:
      label: Longitude (required for in-person or hybrid)
      placeholder: -86.7816
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: Event URL
      description: Link for registration or info
      placeholder: https://example.com
    validations:
      required: false

  - type: textarea
    id: tags
    attributes:
      label: Tags
      description: Comma-separated (e.g. conference, theology, regional)
      placeholder: conference, theology
    validations:
      required: true

  - type: dropdown
    id: featured
    attributes:
      label: Featured Event?
      options:
        - "false"
        - "true"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        `createdAt` will be automatically generated by the system.